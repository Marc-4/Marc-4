name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Run workflow manually
  workflow_dispatch:
  # Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          config_timezone: Asia/Manila

          # Core sections: profile header + repository stats
          base: header, repositories

          # Most-used languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_details: percentage

          # Contribution calendar (3D/isometric view)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # wakatime activity
          plugin_wakatime: yes
          plugin_wakatime_days: 365
          plugin_wakatime_user: 6710797d-0f26-41d3-91b8-a0a5e2f70ddc
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
